name: CI/CD Pipeline

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 24.10.0

      - name: Create .env.test file
        run: |
          cd backend
          echo "MONGO_TEST_URI=${{ secrets.MONGO_TEST_URI }}" >> .env.test
          echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> .env.test
          echo "RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}" >> .env.test
          echo "PORT=${{ secrets.PORT }}" >> .env.test

      - name: Install and test backend
        run: |
          cd backend
          npm ci
          npm test --if-present

  deploy:
    name: Deploy to Production
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install sshpass
        run: sudo apt-get install -y sshpass

      - name: Deploy to DigitalOcean Droplet
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
        run: |
          sshpass -p "${SSH_KEY}" ssh -o StrictHostKeyChecking=no ${SSH_USERNAME}@${SSH_HOST} << 'EOF'
          set -e  # Exit if any command fails

          echo "Fetching latest code..."
          cd /var/www
          git fetch origin master
          git reset --hard origin/master

          echo "Building frontend..."
          cd /var/www/frontend
          npm ci
          npm run build
          sudo systemctl restart nginx

          echo "Restarting backend..."
          cd /var/www/backend
          npm ci
          pm2 restart express-server --update-env

          echo "✅ Deployment complete!"
          EOF
